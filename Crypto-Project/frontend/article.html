<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | GameVault</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/news.css">
</head>
<body>
    <nav class="navbar glass">
        <a href="index.html" class="logo">GameVault</a>
        <div class="nav-actions">
            <div id="authLinks" style="display: inline-flex; gap: 2.5rem; align-items: center;">
                <!-- Populated by JS -->
            </div>
        </div>
    </nav>

    <div class="news-container" style="max-width: 900px; margin-top: 120px;">
        <div style="margin-bottom: 2rem;">
            <a href="newsfeed.html" class="btn btn-secondary">&larr; Back to News</a>
        </div>
        
        <div id="articleContent">

            <div class="loading-spinner">Loading article...</div>
        </div>
    </div>

    <!-- Edit Article Modal -->
    <div id="editModal" class="upload-modal" style="display: none;">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Edit Article</h2>
            <form id="editForm" onsubmit="handleEditSubmit(event)">
                <input type="hidden" id="editArticleId" name="articleId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" name="title" class="form-control" required placeholder="Article Title">
                </div>
                <div class="form-group">
                    <label>Change Cover Image (Optional)</label>
                    <input type="file" id="editImage" name="image" class="form-control" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="editContent" name="content" class="form-control" rows="8" required placeholder="Article content..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const API_NEWS = 'http://localhost:5000/api/news';
        const IMG_BASE = 'http://localhost:5000';
        let currentArticle = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
             const urlParams = new URLSearchParams(window.location.search);
             const id = urlParams.get('id');

             if (!id) {
                 window.location.href = 'newsfeed.html';
                 return;
             }

             try {
                 const res = await fetch(`${API_NEWS}/${id}`);
                 if (!res.ok) throw new Error('Article not found');
                 
                 const item = await res.json();
                 currentArticle = item;
                 
                 const date = new Date(item.created_at).toLocaleDateString(undefined, {
                     year: 'numeric', month: 'long', day: 'numeric'
                 });

                 const adminControlsHtml = isAdmin() ? `
                    <div style="float: right; display: flex; gap: 0.5rem;">
                        <button onclick="openEditModal()" class="btn" style="background: #00f2ea; color: #000; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: bold; border: none; cursor: pointer;">Edit Article</button>
                        <button onclick="deleteArticle(${item.article_id})" class="btn" style="background: #ff0050; color: #fff; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: bold; border: none; cursor: pointer;">Delete Article</button>
                    </div>
                 ` : '';

                 document.getElementById('articleContent').innerHTML = `
                    <div style="overflow: hidden; margin-bottom: 1rem;">
                        <h1 style="font-size: 3rem; margin-bottom: 1rem; line-height: 1.1; color: #fff; display: inline-block;">${item.title}</h1>
                        ${adminControlsHtml}
                    </div>
                    
                    <div class="news-meta" style="font-size: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;">
                        <span>${date}</span>
                    </div>


                    ${item.image_path ? `
                        <img src="${IMG_BASE + item.image_path}" 
                             alt="${item.title}" 
                             style="width: 100%; max-height: 500px; object-fit: cover; border-radius: 20px; margin-bottom: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
                    ` : ''}

                    <div style="font-size: 1.2rem; line-height: 1.8; color: #ddd; white-space: pre-line;">
                        ${item.content}
                    </div>
                 `;

             } catch (err) {
                 console.error(err);
                 document.getElementById('articleContent').innerHTML = '<p>Failed to load article.</p>';
             }
        });

        function openEditModal() {
            if (!currentArticle) return;
            document.getElementById('editArticleId').value = currentArticle.article_id;
            document.getElementById('editTitle').value = currentArticle.title;
            document.getElementById('editContent').value = currentArticle.content;
            document.getElementById('editImage').value = '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function handleEditSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const articleId = document.getElementById('editArticleId').value;
            const formData = new FormData(form);

            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'Saving...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_NEWS}/${articleId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: formData
                });

                const data = await res.json();
                if (res.ok) {
                    showToast('Article updated successfully!');
                    closeEditModal();
                    location.reload();
                } else {
                    showToast(data.message || 'Failed to update article');
                }
            } catch (err) {
                console.error(err);
                showToast('Error updating article');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function deleteArticle(articleId) {
            if (!confirm('Are you sure you want to delete this article?')) return;

            try {
                const res = await fetch(`${API_NEWS}/${articleId}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });

                const data = await res.json();
                if (res.ok) {
                    showToast(data.message || 'Article deleted');
                    setTimeout(() => { window.location.href = 'newsfeed.html'; }, 800);
                } else {
                    showToast(data.message || 'Failed to delete article');
                }
            } catch (err) {
                console.error(err);
                showToast('Error deleting article');
            }
        }
    </script>
</body>
</html>
